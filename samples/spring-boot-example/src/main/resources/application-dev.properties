# Local development: Console, Actuator metrics and application-managed OTLP tracing.
spring.application.name=polyglot-springboot-example
server.address=127.0.0.1
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://127.0.0.1:4318/v1/traces
# The CLI uses these local-only endpoints; the Console accesses managed services directly.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
polyglot.core.log-metadata-on-startup=false
management.endpoint.health.probes.enabled=true
# Jaeger receives traces; keep metrics in Micrometer/Actuator rather than sending them to Jaeger.
management.otlp.metrics.export.enabled=false
polyglot.console.enabled=true
polyglot.console.path=/polyglot-console
polyglot.console.refresh-interval=5s
